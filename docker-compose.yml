services:
  train:
    build: .
    command: ["python", "-m", "src.train", "--config", "configs/config.yaml"]
    volumes:
      - ./artifacts:/app/artifacts

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      train:
        condition: service_completed_successfully

  dashboard:
    build: .
    command: ["streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      PM25_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
