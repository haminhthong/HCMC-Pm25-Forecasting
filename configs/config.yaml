project:
  random_state: 42
data:
  path: data/sample/air_quality_sample.csv
  timestamp_column: timestamp
  station_column: station_id
  target_column: PM2.5
  required_columns: [timestamp, station_id, PM2.5]
  optional_columns: [TSP, NO2, SO2, CO, O3, temperature, humidity]
  zero_as_missing: false
  source_timezone: Asia/Ho_Chi_Minh
  calendar_timezone: Asia/Ho_Chi_Minh
features:
  lags: [1, 2, 3, 6, 12, 24]
  rolling_windows: [3, 6, 24]
  delta_lags: [1, 3]
  include_rolling_std: true
  exogenous_columns: [TSP, NO2, SO2, CO, O3, temperature, humidity]
split:
  test_fraction: 0.1
  calibration_fraction: 0.1
  coverage: 0.9  # P0.2 — target marginal coverage for split-conformal interval
  backtest_folds: 3
  minimum_train_periods: 12
model:
  name: hist_gradient_boosting
  params:
    max_iter: 200
    learning_rate: 0.05
model_comparison:
  candidates: [ridge, hist_gradient_boosting]
# P0.5 — every candidate declared under `model_comparison.candidates` MUST
# have an entry in this block. The single-model `model.params` block above
# remains as a backward-compatible fallback when a candidate name matches
# `model.name`.
models:
  ridge:
    alpha: 1.0
  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.05
thresholds:
  source: experimental
  low_max: 12.0
  medium_max: 35.5
  labels: [Thấp, Trung bình, Cao]
quality_gate:
  minimum_mae_improvement: 0.05
  minimum_high_pm25_recall: 0.75
  maximum_rolling_mae_std: 1.0
  maximum_picp_gap: 0.15
  minimum_calibration_samples_per_station: 20
feature_availability:
  PM2.5: 0
  TSP: 0
  NO2: 0
  SO2: 0
  CO: 0
  O3: 0
  temperature: 0
  humidity: 0
artifacts:
  directory: artifacts
  model_file: model.joblib
  metadata_file: metadata.json
  evaluation_file: evaluation.json
  feature_schema_file: feature_schema.json
  config_snapshot_file: config_snapshot.yaml
mlflow:
  enabled: false
  tracking_uri: mlruns
  experiment_name: hcmc-pm25-next-hour
